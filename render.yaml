services:
  - type: web
    name: vis-scope
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_MODEL
        value: gemini-3.0-flash
      - key: GEMINI_API_KEY
        sync: false
